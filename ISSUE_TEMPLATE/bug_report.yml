name: Bug report
description: Something behaves differently from what the docs or its Explain Trail say it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Include the output or error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal input and steps. Use synthetic or masked text only.
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit, release, or schema/model version.
  - type: textarea
    id: trail
    attributes:
      label: Explain Trail or logs
      description: The relevant excerpt. Remove personal data first.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no personal data, raw source text or credentials.
          required: true
